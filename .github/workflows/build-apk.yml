name: Build Axtor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Axtor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true
      - name: Configure stable signing key when repository secrets are available
        if: ${{ secrets.AXTOR_KEYSTORE_BASE64 != '' && secrets.AXTOR_KEYSTORE_PASSWORD != '' && secrets.AXTOR_KEY_ALIAS != '' && secrets.AXTOR_KEY_PASSWORD != '' }}
        env:
          AXTOR_KEYSTORE_BASE64: ${{ secrets.AXTOR_KEYSTORE_BASE64 }}
          AXTOR_KEYSTORE_PASSWORD: ${{ secrets.AXTOR_KEYSTORE_PASSWORD }}
          AXTOR_KEY_ALIAS: ${{ secrets.AXTOR_KEY_ALIAS }}
          AXTOR_KEY_PASSWORD: ${{ secrets.AXTOR_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing"
          printf '%s' "$AXTOR_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing/axtor-release.jks"
          echo "AXTOR_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/axtor-release.jks" >> "$GITHUB_ENV"
          echo "AXTOR_KEYSTORE_PASSWORD=$AXTOR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AXTOR_KEY_ALIAS=$AXTOR_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AXTOR_KEY_PASSWORD=$AXTOR_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Check required Axtor components
        run: |
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/AxtorAgent.java
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/HybridAiRouter.java
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/SelfCodingEngine.java
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/RepairLoop.java
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/SelfModificationOrchestrator.java
          test -f app/src/main/java/com/ayushdebbarma/myaiagent/SafeActivationManager.java
      - name: Clean
        run: ./gradlew clean
      - name: Run unit tests
        run: ./gradlew test --stacktrace
      - name: Build updateable release APK
        run: ./gradlew assembleRelease --stacktrace --info
      - name: Locate APK
        run: |
          echo "Generated APKs:"
          find . -type f -name "*.apk" -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Axtor-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 30

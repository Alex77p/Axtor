name: Release Axtor

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and package Axtor release
    runs-on: ubuntu-latest
    env:
      AXTOR_KEYSTORE_BASE64: ${{ secrets.AXTOR_KEYSTORE_BASE64 }}
      AXTOR_KEYSTORE_PASSWORD: ${{ secrets.AXTOR_KEYSTORE_PASSWORD }}
      AXTOR_KEY_ALIAS: ${{ secrets.AXTOR_KEY_ALIAS }}
      AXTOR_KEY_PASSWORD: ${{ secrets.AXTOR_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Configure stable signing key when secrets are available
        if: ${{ env.AXTOR_KEYSTORE_BASE64 != '' && env.AXTOR_KEYSTORE_PASSWORD != '' && env.AXTOR_KEY_ALIAS != '' && env.AXTOR_KEY_PASSWORD != '' }}
        run: |
          mkdir -p signing
          printf '%s' "$AXTOR_KEYSTORE_BASE64" | base64 --decode > signing/axtor-release.jks
          echo "AXTOR_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/axtor-release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release outputs
        run: |
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axtor-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

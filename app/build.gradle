plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.ayushdebbarma.myaiagent'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ayushdebbarma.myaiagent'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('AXTOR_KEYSTORE_FILE')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                storeFile = file(ks)
                storePassword = System.getenv('AXTOR_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('AXTOR_KEY_ALIAS')
                keyPassword = System.getenv('AXTOR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            def hasStableKey = System.getenv('AXTOR_KEYSTORE_FILE') != null && !System.getenv('AXTOR_KEYSTORE_FILE').isEmpty()
            signingConfig = hasStableKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1'] } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
